<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشغل السيارة الذكي</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body { background-color: #0b0f19; color: #fff; padding-bottom: 100px; }
        header { background: #111827; padding: 18px; text-align: center; font-size: 22px; font-weight: bold; border-bottom: 2px solid #06b6d4; color: #06b6d4; }
        .tabs { display: flex; background: #1f2937; }
        .tab { flex: 1; padding: 15px; text-align: center; font-weight: bold; color: #9ca3af; cursor: pointer; border-bottom: 3px solid transparent; font-size: 16px; }
        .tab.active { color: #06b6d4; border-bottom: 3px solid #06b6d4; background: #111827; }
        .content { display: none; padding: 12px; }
        .content.active { display: block; }
        .item-card { background: #1f2937; margin: 10px 0; padding: 14px; border-radius: 10px; display: flex; align-items: center; justify-content: space-between; border-right: 5px solid #06b6d4; }
        .info h4 { font-size: 18px; margin-bottom: 4px; color: #f3f4f6; }
        .info p { font-size: 14px; color: #9ca3af; }
        .actions button { background: #374151; border: none; color: #fff; padding: 10px 16px; border-radius: 6px; cursor: pointer; margin-left: 8px; font-size: 15px; font-weight: bold; }
        .actions button.saved { background: #059669; }
        .actions button.play { background: #0891b2; }
        
        /* شريط التشغيل السفلي الخاص بالسيارة */
        .player-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #111827; padding: 15px; display: flex; flex-direction: column; align-items: center; border-top: 2px solid #374151; box-shadow: 0 -4px 10px rgba(0,0,0,0.5); }
        .player-info { width: 100%; text-align: center; margin-bottom: 8px; }
        .player-info h5 { font-size: 16px; color: #22d3ee; }
        .player-info p { font-size: 13px; color: #9ca3af; }
        audio { width: 100%; height: 40px; }
    </style>
</head>
<body>

    <header>🚗 مشغل السيارة بدون إنترنت</header>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('tilawat', this)">📖 قسم التلاوات</div>
        <div class="tab" onclick="switchTab('songs', this)">🎵 قسم الأغاني</div>
    </div>

    <!-- قسم التلاوات -->
    <div id="tilawat" class="content active">
        <div id="tilawat-list"></div>
    </div>

    <!-- قسم الأغاني -->
    <div id="songs" class="content">
        <div id="songs-list"></div>
    </div>

    <!-- شريط التشغيل السفلي -->
    <div class="player-bar">
        <div class="player-info">
            <h5 id="current-title">اختر مقطعاً للتشغيل</h5>
            <p id="current-artist">-</p>
        </div>
        <audio id="audio-player" controls></audio>
    </div>

    <script>
        const tilawatData = [
            { title: 'سورة الحاقة', artist: 'ياسر الدوسري', url: 'https://server11.mp3quran.net/yasser/069.mp3' },
            { title: 'سورة المؤمنون', artist: 'ياسر الدوسري', url: 'https://server11.mp3quran.net/yasser/023.mp3' },
            { title: 'سورة لقمان', artist: 'ياسر الدوسري', url: 'https://server11.mp3quran.net/yasser/031.mp3' },
            { title: 'سورة التكوير', artist: 'ياسر الدوسري', url: 'https://server11.mp3quran.net/yasser/081.mp3' },
            { title: 'سورة الرحمن', artist: 'محمد صديق المنشاوي', url: 'https://server11.mp3quran.net/minsh/055.mp3' },
            { title: 'سورة القارعة', artist: 'محمد صديق المنشاوي', url: 'https://server11.mp3quran.net/minsh/101.mp3' },
            { title: 'سورة الضحى', artist: 'محمد صديق المنشاوي', url: 'https://server11.mp3quran.net/minsh/093.mp3' },
            { title: 'سورة الفجر', artist: 'محمد صديق المنشاوي', url: 'https://server11.mp3quran.net/minsh/089.mp3' },
            { title: 'سورة الكهف', artist: 'عبد الباسط عبد الصمد', url: 'https://server7.mp3quran.net/abdulsamad/018.mp3' },
            { title: 'سورة يوسف', artist: 'عبد الباسط عبد الصمد', url: 'https://server7.mp3quran.net/abdulsamad/012.mp3' },
            { title: 'سورة النجم', artist: 'رعد الكردي', url: 'https://server12.mp3quran.net/raad/053.mp3' },
            { title: 'سورة طه', artist: 'رعد الكردي', url: 'https://server12.mp3quran.net/raad/020.mp3' },
            { title: 'سورة ق', artist: 'رعد الكردي', url: 'https://server12.mp3quran.net/raad/050.mp3' },
            { title: 'سورة النمل', artist: 'رعد الكردي', url: 'https://server12.mp3quran.net/raad/027.mp3' }
        ];

        const songsData = [
            { title: 'Charxi Baxt', artist: 'hama Krmashani', url: 'https://royalfiletolink.koyeb.app/stream/45465?hash=95ff947c74b1f52a&d=true' },
            { title: 'Dktor', artist: 'hama Krmashani', url: 'https://royalfiletolink.koyeb.app/stream/45468?hash=29d198714cf3c5ee&d=true' },
            { title: 'Shet bwm', artist: 'hama Krmashani', url: 'https://royalfiletolink.koyeb.app/stream/45467?hash=9fc1ca6e4eb5fd45&d=true' },
            { title: 'Qabrekm-Bo Halkann', artist: 'hama Krmashani', url: 'https://royalfiletolink.koyeb.app/stream/45471?hash=cb671e3b66a3fff5&d=true' },
            { title: 'Da Bro Jem Bella', artist: 'Jegr Medya', url: 'https://royalfiletolink.koyeb.app/stream/45473?hash=b6d193357cac34b6&d=true' },
            { title: 'Hawlerya Hawlerya', artist: 'Jegr Medya', url: 'https://royalfiletolink.koyeb.app/stream/45475?hash=fa944164e2d50e35&d=true' },
            { title: 'Amshaw ba Dll Pryawa', artist: 'Jegr Medya', url: 'https://royalfiletolink.koyeb.app/stream/45477?hash=67fc2055dafff3d1&d=true' },
            { title: 'La Kwey Azizi dilm', artist: 'Jegr Medya', url: 'https://royalfiletolink.koyeb.app/stream/45483?hash=678f466f240f95e8&d=true' },
            { title: 'Alla Lemdan Ba Tire', artist: 'ham ali', url: 'https://royalfiletolink.koyeb.app/stream/45479?hash=a6cefc47ce0933ab&d=true' },
            { title: 'Chuma Mali Ba Miwani', artist: 'فنان', url: 'https://royalfiletolink.koyeb.app/stream/45481?hash=4787ece0b13220e6&d=true' }
        ];

        const CACHE_NAME = 'car-audio-cache-v1';

        function renderLists() {
            renderSection('tilawat-list', tilawatData);
            renderSection('songs-list', songsData);
            checkSavedStatus();
        }

        function renderSection(containerId, data) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            data.forEach((item) => {
                const safeId = btoa(unescape(encodeURIComponent(item.title))).replace(/=/g, '');
                container.innerHTML += `
                    <div class="item-card">
                        <div class="info">
                            <h4>${item.title}</h4>
                            <p>${item.artist}</p>
                        </div>
                        <div class="actions">
                            <button id="btn-${safeId}" onclick="saveAudio('${item.url}', '${safeId}', '${item.title}')">💾 حفظ</button>
                            <button class="play" onclick="playAudio('${item.url}', '${item.title}', '${item.artist}')">▶ تشغيل</button>
                        </div>
                    </div>
                `;
            });
        }

        function switchTab(tabId, element) {
            document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            element.classList.add('active');
        }

        // حفظ الصوت داخل ذاكرة التطبيق بدون فتح أي روابط خارجية
        async function saveAudio(url, safeId, title) {
            try {
                const btn = document.getElementById(`btn-${safeId}`);
                btn.innerText = 'جاري الحفظ...';
                
                const cache = await caches.open(CACHE_NAME);
                await cache.add(url);
                
                btn.innerText = '✔ محفوض';
                btn.classList.add('saved');
                alert(`تم حفظ "${title}" في ذاكرة التطبيق بنجاح!`);
            } catch (e) {
                alert('فشل الحفظ: تأكد من الاتصال بالإنترنت أثناء الحفظ لأول مرة.');
                const btn = document.getElementById(`btn-${safeId}`);
                btn.innerText = '💾 حفظ';
            }
        }

        async function checkSavedStatus() {
            const cache = await caches.open(CACHE_NAME);
            const allItems = [...tilawatData, ...songsData];
            for (let item of allItems) {
                const safeId = btoa(unescape(encodeURIComponent(item.title))).replace(/=/g, '');
                const match = await cache.match(item.url);
                const btn = document.getElementById(`btn-${safeId}`);
                if (match && btn) {
                    btn.innerText = '✔ محفوض';
                    btn.classList.add('saved');
                }
            }
        }

        // تشغيل الصوت (يعمل أوفلاين من الذاكرة إذا تم حفظه مسبقاً)
        function playAudio(url, title, artist) {
            const player = document.getElementById('audio-player');
            document.getElementById('current-title').innerText = title;
            document.getElementById('current-artist').innerText = artist;
            player.src = url;
            player.play().catch(() => {
                alert('تعذر التشغيل، يرجى التأكد من حفظ الملف أو الاتصال بالإنترنت.');
            });
        }

        window.onload = renderLists;
    </script>
</body>
</html>
