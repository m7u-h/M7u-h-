<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>app m7u-h</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root {
    --bg:#0a0a0f; --card:#15151f; --card2:#1d1d2b;
    --accent:#00e0b8; --accent2:#00b8ff;
    --text:#fff; --muted:#7a7a90; --danger:#ff4757;
  }
  html,body {
    height:100%; background:var(--bg); color:var(--text);
    font-family:'Segoe UI', Tahoma, sans-serif; overflow:hidden; user-select:none;
  }
  body {
    display:flex; flex-direction:column;
    background: radial-gradient(circle at 20% 0%, rgba(0,224,184,0.15), transparent 50%),
                radial-gradient(circle at 80% 100%, rgba(0,184,255,0.12), transparent 50%),
                var(--bg);
  }
  header {
    display:flex; justify-content:space-between; align-items:center;
    padding:16px 18px; padding-top: calc(16px + env(safe-area-inset-top));
  }
  .btn-downloads {
    background:var(--card); color:var(--text); border:none;
    padding:10px 16px; border-radius:14px; font-size:14px; font-weight:600;
    display:flex; align-items:center; gap:8px;
  }
  .user {
    display:flex; align-items:center; gap:10px;
    background:var(--card); padding:8px 14px; border-radius:14px;
  }
  .user .name { font-size:14px; font-weight:700; color:var(--accent); }
  .socials { display:flex; gap:6px; }
  .socials a {
    width:26px; height:26px; border-radius:8px; background:var(--card2);
    display:flex; align-items:center; justify-content:center; text-decoration:none;
  }
  .socials svg { width:14px; height:14px; }
  main {
    flex:1; display:flex; flex-direction:column;
    justify-content:center; align-items:center; padding:0 24px; gap:18px;
  }
  .logo {
    font-size:42px; font-weight:900; letter-spacing:2px;
    background:linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  }
  .subtitle { color:var(--muted); font-size:13px; margin-bottom:24px; }
  .input-wrap { width:100%; position:relative; }
  #urlInput {
    width:100%; background:var(--card); border:1.5px solid transparent;
    color:var(--text); font-size:14px; padding:16px 54px 16px 16px;
    border-radius:16px; outline:none;
  }
  #urlInput:focus { border-color:var(--accent); }
  #urlInput::placeholder { color:var(--muted); }
  .paste-btn {
    position:absolute; left:8px; top:50%; transform:translateY(-50%);
    background:var(--card2); border:none; color:var(--accent);
    padding:8px 12px; border-radius:10px; font-size:12px; font-weight:600;
  }
  #downloadBtn {
    width:100%; height:74px; margin-top:6px; border:none; border-radius:20px;
    background:linear-gradient(135deg, var(--accent), var(--accent2));
    color:#000; font-size:19px; font-weight:800;
    display:flex; align-items:center; justify-content:center; gap:10px;
    box-shadow:0 12px 32px -8px rgba(0,224,184,0.5);
  }
  #downloadBtn:active { transform:scale(0.97); }
  #downloadBtn:disabled { opacity:0.5; }
  #downloadBtn svg { width:24px; height:24px; }
  footer { padding:18px 24px; padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
  .format-toggle {
    display:flex; background:var(--card); border-radius:16px; padding:5px; gap:5px;
  }
  .format-toggle button {
    flex:1; padding:13px; border:none; background:transparent;
    color:var(--muted); font-size:14px; font-weight:700;
    border-radius:12px;
  }
  .format-toggle button.active {
    background:linear-gradient(135deg, var(--accent), var(--accent2)); color:#000;
  }
  #progressOverlay {
    position:fixed; inset:0; background:rgba(5,5,10,0.9);
    backdrop-filter:blur(20px); display:none;
    align-items:center; justify-content:center; z-index:100; padding:32px;
  }
  #progressOverlay.show { display:flex; }
  .progress-card {
    width:100%; max-width:340px; background:var(--card);
    border-radius:24px; padding:32px; text-align:center;
  }
  .spinner {
    width:70px; height:70px; margin:0 auto 20px;
    border:5px solid var(--card2); border-top-color:var(--accent);
    border-radius:50%; animation:spin 1s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  .progress-title { font-size:16px; font-weight:700; margin-bottom:6px; }
  .progress-sub { font-size:12px; color:var(--muted); }
  #downloadsPanel {
    position:fixed; inset:0; background:var(--bg); z-index:200; display:none;
    flex-direction:column;
    padding-top: calc(16px + env(safe-area-inset-top));
    padding-bottom: calc(16px + env(safe-area-inset-bottom));
  }
  #downloadsPanel.show { display:flex; }
  .panel-head {
    display:flex; justify-content:space-between; align-items:center;
    padding:0 18px 16px;
  }
  .panel-head h2 { font-size:20px; }
  .close-btn {
    background:var(--card); border:none; color:var(--text);
    width:38px; height:38px; border-radius:12px; font-size:18px;
  }
  #downloadsList {
    flex:1; overflow-y:auto; padding:0 18px 18px;
    display:flex; flex-direction:column; gap:10px;
  }
  .empty { color:var(--muted); text-align:center; padding:60px 20px; font-size:14px; }
  .file-item {
    background:var(--card); border-radius:16px; padding:14px;
    display:flex; align-items:center; gap:12px;
  }
  .file-icon {
    width:44px; height:44px; border-radius:12px;
    background:linear-gradient(135deg, var(--accent), var(--accent2));
    display:flex; align-items:center; justify-content:center;
    font-size:20px; flex-shrink:0;
  }
  .file-info { flex:1; min-width:0; }
  .file-name {
    font-size:13px; font-weight:600; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; margin-bottom:4px;
  }
  .file-meta { font-size:11px; color:var(--muted); }
  .file-actions { display:flex; gap:6px; }
  .file-actions button {
    width:38px; height:38px; border:none; border-radius:10px;
    background:var(--card2); color:var(--text); font-size:16px;
  }
  .file-actions button.delete { color:var(--danger); }
  #toast {
    position:fixed; bottom:110px; left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--card2); color:var(--text);
    padding:12px 20px; border-radius:14px; font-size:13px; font-weight:600;
    opacity:0; transition:0.3s; z-index:500; pointer-events:none;
    max-width:90%; text-align:center; border:1px solid rgba(0,224,184,0.3);
  }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  ::-webkit-scrollbar { display:none; }
</style>
</head>
<body>

<header>
  <button class="btn-downloads" onclick="openDownloads()">
    <span>📥</span> داگرتنەکان
  </button>
  <div class="user">
    <span class="name">@m7u_h</span>
    <div class="socials">
      <!-- TikTok -->
      <a href="https://www.tiktok.com/@m7u_h">
        <svg viewBox="0 0 24 24" fill="#fff"><path d="M19.6 6.3a5 5 0 0 1-3-2.3 4.9 4.9 0 0 1-.6-2H13v13.1a2.9 2.9 0 1 1-2-2.7V9.3a6 6 0 1 0 5 5.9V9a8 8 0 0 0 4.5 1.4V7.3a5 5 0 0 1-.9-.1z"/></svg>
      </a>
      <!-- Telegram -->
      <a href="tg://resolve?domain=m7u_h">
        <svg viewBox="0 0 24 24" fill="#29A9EB"><path d="M22 3 2 10.5l5 1.7 2 6.3 3-3.6 5 3.6L22 3z"/></svg>
      </a>
      <!-- Snapchat -->
      <a href="snapchat://add/m7u_h">
        <svg viewBox="0 0 24 24" fill="#FFFC00"><path d="M12 2c3 0 5 2 5 5 0 1-.1 1.7-.2 2.4.6.2 1.4-.3 1.9-.1.5.2.6.8.2 1.2-.4.4-1.3.7-1.5 1.4-.1.5.3 1.4 1.2 2.6.6.8 1.8 1.4 1.8 1.9s-1.6.9-2.6 1.2c-.3.1-.4.3-.4.7-.1.5-.3 1-1.1 1-.7 0-1.4-.3-2.3-.3-1.4 0-2 .9-3 1.5-.3.2-.6.4-1 .4s-.7-.2-1-.4c-1-.6-1.6-1.5-3-1.5-.9 0-1.6.3-2.3.3-.8 0-1-.5-1.1-1-.1-.4-.1-.6-.4-.7C3.2 17.4 2 17 2 16.5s1.2-1.1 1.8-1.9c.9-1.2 1.3-2.1 1.2-2.6-.2-.7-1.1-1-1.5-1.4-.4-.4-.3-1 .2-1.2.5-.2 1.3.3 1.9.1-.1-.7-.2-1.4-.2-2.4 0-3 2-5 5-5z"/></svg>
      </a>
    </div>
  </div>
</header>

<main>
  <div class="logo">app m7u-h</div>
  <div class="subtitle">تەنها داگرتن لە تیکتۆک</div>

  <div class="input-wrap">
    <input id="urlInput" type="text" placeholder="لینکی ڤیدیۆی تیکتۆک لێرە بلکێنە...">
    <button class="paste-btn" onclick="pasteUrl()">📋 بلکێنە</button>
  </div>

  <button id="downloadBtn" onclick="startDownload()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <polyline points="7 10 12 15 17 10"/>
      <line x1="12" y1="15" x2="12" y2="3"/>
    </svg>
    داگرتن
  </button>
</main>

<footer>
  <div class="format-toggle">
    <button data-format="mp4" class="active" onclick="selectFormat(this)">🎬 ڤیدیۆ MP4</button>
    <button data-format="mp3" onclick="selectFormat(this)">🎵 دەنگ MP3</button>
  </div>
</footer>

<div id="progressOverlay">
  <div class="progress-card">
    <div class="spinner"></div>
    <div class="progress-title">لە داگرتندایە...</div>
    <div class="progress-sub" id="progSub">تکایە چاوەڕوان بە</div>
  </div>
</div>

<div id="downloadsPanel">
  <div class="panel-head">
    <h2>📥 داگرتنەکان</h2>
    <button class="close-btn" onclick="closeDownloads()">✕</button>
  </div>
  <div id="downloadsList"></div>
</div>

<div id="toast"></div>

<script>
  let currentFormat = 'mp4';

  function selectFormat(btn) {
    document.querySelectorAll('.format-toggle button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFormat = btn.dataset.format;
  }

  function pasteUrl() {
    const input = document.getElementById('urlInput');
    input.focus();
    try {
      if (navigator.clipboard && navigator.clipboard.readText) {
        navigator.clipboard.readText().then(t => {
          if (t) { input.value = t; showToast('بلکێنرا ✓'); }
          else showToast('کلیپبۆرد بەتاڵە');
        }).catch(() => document.execCommand('paste'));
      } else {
        document.execCommand('paste');
      }
    } catch(e) { document.execCommand('paste'); }
  }

  function startDownload() {
    const url = document.getElementById('urlInput').value.trim();
    if (!url) { showToast('سەرەتا لینک بلکێنە'); return; }
    if (!/^https?:\/\//i.test(url)) { showToast('لینکەکە دروست نییە'); return; }
    if (!/tiktok\.com/i.test(url)) { showToast('تەنها لینکی تیکتۆک قبوڵ دەکرێت'); return; }

    document.getElementById('downloadBtn').disabled = true;
    showProgress();
    Android.download(url, currentFormat);
  }

  function showProgress() {
    document.getElementById('progressOverlay').classList.add('show');
    document.getElementById('progSub').textContent = 'تکایە چاوەڕوان بە...';
  }

  function hideProgress() {
    document.getElementById('progressOverlay').classList.remove('show');
    document.getElementById('downloadBtn').disabled = false;
  }

  window.onProgress = function() {};

  window.onComplete = function(name) {
    document.getElementById('progSub').textContent = '✓ پاشەکەوت کرا: ' + name;
    document.getElementById('downloadBtn').disabled = false;
    showToast('✓ بە سەرکەوتوویی داگرت');
    setTimeout(hideProgress, 1500);
  };

  window.onError = function(msg) {
    document.getElementById('downloadBtn').disabled = false;
    hideProgress();
    showToast('✕ ' + msg);
  };

  function openDownloads() {
    renderDownloads();
    document.getElementById('downloadsPanel').classList.add('show');
  }

  function closeDownloads() {
    document.getElementById('downloadsPanel').classList.remove('show');
  }

  function renderDownloads() {
    let list = [];
    try { list = JSON.parse(Android.getDownloads()); } catch(e) {}
    list.sort((a,b) => b.date - a.date);
    const c = document.getElementById('downloadsList');

    if (list.length === 0) {
      c.innerHTML = '<div class="empty">هێشتا هیچ فایلێکی داگرتە نییە</div>';
      return;
    }

    c.innerHTML = list.map(f => {
      const isAudio = f.name.toLowerCase().endsWith('.mp3');
      const sizeMB = (f.size / 1048576).toFixed(2);
      const nameEsc = f.name.replace(/'/g, "\\'").replace(/"/g, '&quot;');
      const pathEsc = f.path.replace(/'/g, "\\'").replace(/"/g, '&quot;');

      return `
        <div class="file-item">
          <div class="file-icon">${isAudio ? '🎵' : '🎬'}</div>
          <div class="file-info" onclick="Android.openFile('${pathEsc}')">
            <div class="file-name">${nameEsc}</div>
            <div class="file-meta">${sizeMB} MB</div>
          </div>
          <div class="file-actions">
            <button onclick="Android.openFile('${pathEsc}')">▶</button>
            <button class="delete" onclick="delFile('${pathEsc}')">🗑</button>
          </div>
        </div>`;
    }).join('');
  }

  function delFile(path) {
    Android.deleteFile(path);
    setTimeout(renderDownloads, 200);
  }

  let toastTimer;
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
  }
</script>
</body>
</html>
